# omni-rag-engine 检索层评估 · 黄金集（M2 长语料版）
#
# 设计依据：eval-design.md §3
# 核心原则：标注「原文区间」而非 chunk_id —— 一套标注可评所有切块策略
# 文件冻结：本语料与标注一旦定稿不再修改，否则历史报告的行号将失效

meta:
  name: safety-dual-prevention-manual
  document: tests/eval/corpus/safety-dual-prevention-manual.md
  eval_target: chunking_strategy
  location_kind: line_range
  top_k: 5
  corpus_lines: 454
  note: >-
    M2 长语料版：语料 11835 字符 / 454 行，使各策略切片数均达同一量级
    （sliding_window 26 块、header_aware 64 块、parent_child 58 块），
    top_k=5 的语料覆盖率由 M1 的 62% 降至 19.2%，指标不再必然饱和。
    仍建议配合 --k-ratio 按切片数归一化 k，以消除各策略切片数差异带来的偏向。

# 结构覆盖矩阵：每条 query 注明它要考察的文档结构场景
#   heading_depth     深层标题（####）→ 标题感知切块的层级处理
#   long_table        长表格（9 行以上）→ 表格是否被从中间切断
#   table_after_head  紧贴标题的表格 → 表头与该行是否同块
#   cross_ref         跨章节引用 → 块跨越章节边界时的表现
#   long_section      超长小节 → 滑动窗口强制切分
#   short_section     极短小节 → 是否产生碎片块
#   code_block        配置/代码块 → 是否被从中间切断
#   multi_mention     同一事实多处出现 → 需用 recall 而非 Hit 才能体现
#   faq_echo          FAQ 与正文重复表述 → 多区间标注

queries:
  # ---------------------------------------------------------- fact（9 条，预期小块占优）
  - id: q001
    type: fact
    expected_advantage: sliding_window
    coverage_intent: long_table
    query: "重大风险的色标是什么，危险性分值的下限是多少"
    answer_spans:
      - start_line: 119
        end_line: 119
    rationale: "表格行级检索。若切块把表头与数据行分离，则该行失去『色标』语义"

  - id: q002
    type: fact
    expected_advantage: sliding_window
    coverage_intent: long_table
    query: "一般风险的管控层级由谁负责"
    answer_spans:
      - start_line: 121
        end_line: 121
    rationale: "同表另一行，与 q001 交叉验证表格行定位能力"

  - id: q003
    type: fact
    expected_advantage: sliding_window
    coverage_intent: multi_mention, faq_echo
    query: "隐患整改延期原则上不能超过几次"
    answer_spans:
      - start_line: 184
        end_line: 184
      - start_line: 438
        end_line: 438
    rationale: "正文 4.5 与附录 C 问答重复表述同一事实，多区间标注考察 recall 而非仅 Hit"

  - id: q004
    type: fact
    expected_advantage: sliding_window
    coverage_intent: multi_mention, faq_echo
    query: "培训档案的保存期限是多久"
    answer_spans:
      - start_line: 287
        end_line: 287
      - start_line: 454
        end_line: 454
    rationale: "同 q003 的多区间结构，用于验证该模式是否稳定复现"

  - id: q005
    type: fact
    expected_advantage: sliding_window
    coverage_intent: long_table
    query: "主要负责人每年的培训学时不少于多少"
    answer_spans:
      - start_line: 281
        end_line: 281
    rationale: "培训频次表首行，考察表头与首个数据行是否同块"

  - id: q006
    type: fact
    expected_advantage: sliding_window
    coverage_intent: long_table
    query: "专职安全员每年的学时要求是多少"
    answer_spans:
      - start_line: 282
        end_line: 282
    rationale: "与 q005 同为表内相邻行，用于区分『表头同块』与『仅该行命中』"

  - id: q007
    type: fact
    expected_advantage: sliding_window
    coverage_intent: short_section
    query: "特殊作业时监护人离开后，作业中断超过多久需要重新确认"
    answer_spans:
      - start_line: 347
        end_line: 347
    rationale: "答案落在一个较短小节内，考察短小节是否被切成碎片块"

  - id: q008
    type: fact
    expected_advantage: sliding_window
    coverage_intent: none
    query: "应急预案至少多久修订一次"
    answer_spans:
      - start_line: 369
        end_line: 369
    rationale: "基础事实召回，作为对照基线"

  - id: q009
    type: fact
    expected_advantage: sliding_window
    coverage_intent: none
    query: "实行作业许可管理的特殊作业包括哪几类"
    answer_spans:
      - start_line: 341
        end_line: 341
    rationale: "单句内枚举八类作业，考察块内是否被截断"

  # ------------------------------------------------------ summary（5 条，预期大块占优）
  - id: q010
    type: summary
    expected_advantage: header_aware
    coverage_intent: none
    query: "双重预防机制的运行流程包含哪些步骤"
    answer_spans:
      - start_line: 29
        end_line: 31
    rationale: "流程为单一长句枚举，考察整段是否完整落在同一块内"

  - id: q011
