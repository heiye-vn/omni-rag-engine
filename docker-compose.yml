name: omni-rag-engine

services:
  # ----------------------------------------------------------------------------
  # 1. omni-rag-api: 全模态 RAG 引擎与 FastAPI 微服务
  # ----------------------------------------------------------------------------
  omni-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni_rag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./app:/app/app
      - omni_rag_data:/app/data
    depends_on:
      qdrant:
        condition: service_started
      pgvector:
        condition: service_healthy
      redis:
        condition: service_started

  # ----------------------------------------------------------------------------
  # 2. Qdrant: 高性能向量数据库 (Vector Database)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omni_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # ----------------------------------------------------------------------------
  # 3. PGVector: PostgreSQL 16 + pgvector 扩展
  # ----------------------------------------------------------------------------
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: omni_rag_pgvector
    restart: unless-stopped
    environment:
      POSTGRES_DB: omni_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 4. Redis: 高速缓存与异步任务队列 (Task Queue / Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: omni_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  omni_rag_data:
  qdrant_storage:
  pgvector_data:
  redis_data:
